<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Your order</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <!--
    SEGUIMIENTO EE.UU. (14-oct-2026) — pedido/us.html?t=<token>&lang=en|es[&pago=ok]
    Lee SU pedido por el código secreto del link con la función us_seguimiento (SQL 051, 19-oct-2026):
    la llave pública ya no puede leer la tabla pedidos_us, y la función no devuelve datos del cliente
    (nombre, teléfono, dirección). Al volver de Stripe (pago=ok) avisa a n8n
    `us-evento` para confirmar el pago al instante (el cron lo hace igual cada minuto).
    Muestra el link de seguimiento de DoorDash cuando el repartidor ya está asignado.
  -->
  <style>
    :root { --tinta: #1A1714; --gris: #6B645E; --linea: #E7E1DA; --fondo: #FAF7F3; --blanco: #fff; --ok: #15803D; --aviso: #B45309; --err: #B91C1C; --acento: #E8431A; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Inter Tight", system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--fondo); color: var(--tinta); line-height: 1.45; }
    .wrap { max-width: 520px; margin: 0 auto; padding: 22px 16px 48px; }
    .local { font-weight: 800; font-size: 15px; color: var(--gris); }
    h1 { font-size: 30px; line-height: 1.1; letter-spacing: -.02em; margin: 6px 0 4px; }
    .sub { color: var(--gris); font-size: 15px; }
    .caja { background: var(--blanco); border: 1px solid var(--linea); border-radius: 16px; padding: 16px; margin-top: 14px; }
    .pasos { list-style: none; }
    .pasos li { display: flex; gap: 12px; align-items: flex-start; padding: 8px 0; color: #A39A92; font-weight: 600; }
    .pasos li .pt { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #D9D1C8; flex: none; margin-top: 1px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff; }
    .pasos li.hecho { color: var(--tinta); }
    .pasos li.hecho .pt { background: var(--ok); border-color: var(--ok); }
    .pasos li.ahora { color: var(--tinta); font-weight: 800; }
    .pasos li.ahora .pt { border-color: var(--acento); box-shadow: 0 0 0 4px rgba(232,67,26,.15); }
    .pasos li small { display: block; font-weight: 500; color: var(--gris); font-size: 13px; }
    .pago { border-radius: 12px; padding: 10px 12px; font-weight: 700; font-size: 14px; margin-top: 12px; }
    .pago.ok { background: #ECFDF3; color: var(--ok); }
    .pago.espera { background: #FFF7ED; color: var(--aviso); }
    .pago.err { background: #FEF2F2; color: var(--err); }
    .boton { display: block; text-align: center; background: var(--tinta); color: #fff; text-decoration: none; font-weight: 800; border-radius: 13px; padding: 15px; margin-top: 12px; }
    .fila { display: flex; justify-content: space-between; gap: 10px; font-size: 14.5px; padding: 4px 0; }
    .fila.total { border-top: 1px dashed var(--linea); margin-top: 6px; padding-top: 10px; font-weight: 800; font-size: 17px; }
    .gris { color: var(--gris); }
    .titulo { font-weight: 800; font-size: 14px; margin-bottom: 8px; }
    .pie { text-align: center; font-size: 12px; color: var(--gris); margin-top: 18px; }
    .cargando { text-align: center; color: var(--gris); padding: 60px 0; }
    .mapa { height: 230px; border-radius: 12px; overflow: hidden; background: #EDE8E1; }
    .mapa-txt { font-size: 14px; font-weight: 700; margin-top: 10px; }
    .mapa-txt small { display: block; font-weight: 500; color: var(--gris); font-size: 12.5px; }
    .pin-moto { width: 22px; height: 22px; border-radius: 50%; background: var(--acento); border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(232,67,26,.25), 0 2px 6px rgba(0,0,0,.3); }
    .pin-casa { width: 16px; height: 16px; border-radius: 50%; background: var(--tinta); border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.3); }
  </style>
  <!-- MAPA DEL REPARTIDOR (14-oct-2026): con repartidor propio en camino, el cliente ve su posicion
       (funcion us_seguimiento_mapa, SQL 040). Leaflet + OpenStreetMap se cargan solo si hace falta. -->
</head>
<body>
  <div class="wrap" id="app"><p class="cargando" id="cargando">Loading your order…</p></div>
  <noscript><p style="padding:20px;text-align:center">Please enable JavaScript to see your order.</p></noscript>
  <script>
  (function () {
    var SB = 'https://wfpdtjmmrhhfuxayvpzu.supabase.co/rest/v1';
    var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndmcGR0am1tcmhoZnV4YXl2cHp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwNzE1NDksImV4cCI6MjA4ODY0NzU0OX0.Iyeogfs5AIiVrM5agXuMZsgFrud460OYvn0zkYgJH0s';
    var AVISO = 'https://n8n.dewansas.com/webhook/us-evento';
    var q = new URLSearchParams(location.search);
    var token = (q.get('t') || '').replace(/[^a-z0-9]/gi, '');
    var EN = q.get('lang') !== 'es';
    var volvioDePagar = q.get('pago') === 'ok';
    var T = EN ? {
      cargando: 'Loading your order…', noEncontrado: "We couldn't find this order.", pedido: 'Order',
      recibido: 'Order received', recibidoS: 'The restaurant will confirm it in a moment',
      preparando: 'Preparing your food', preparandoS: function (h) { return h ? 'Ready around ' + h : 'The kitchen is on it'; },
      enCamino: 'On the way', enCaminoS: 'Your driver has your food', enCaminoPropio: "The restaurant's driver is on the way",
      listoEnvio: 'Ready', listoEnvioS: 'Waiting for the driver to pick it up', efectivo: '💵 You pay cash on delivery',
      repartidorPropio: "Delivered by the restaurant's own driver", listo: 'Ready for pickup', listoS: function (d) { return d ? 'At ' + d : 'Come on in'; },
      entregado: 'Delivered', entregadoS: 'Enjoy your meal!', retirado: 'Picked up', retiradoS: 'Enjoy your meal!',
      cancelado: 'Order cancelled', canceladoS: function (m) { return m || 'The restaurant could not take this order.'; },
      pagado: '✓ Paid by card', porPagar: 'Confirming your payment…', fallido: "Your payment didn't go through — this order was not placed.",
      enLocal: '🏪 You pay at pickup', reembolsado: '↩︎ Refunded to your card', seguir: 'Track your driver on DoorDash',
      resumen: 'Your order', subtotal: 'Subtotal', impuesto: 'Tax', envio: 'Delivery', propina: 'Tip', total: 'Total',
      repartidor: 'Your DoorDash driver will pick it up', retiroEn: 'Pickup at', llamar: 'Call the restaurant', actualizado: 'Updates automatically',
      mapaEspera: "Waiting for the driver's location…", mapaCerca: 'Your driver is almost there',
      mapaDist: function (mi) { return 'Your driver is about ' + mi + ' miles away'; }, mapaHace: function (s) { return 'Updated ' + (s < 60 ? s + ' s' : Math.round(s / 60) + ' min') + ' ago'; },
    } : {
      cargando: 'Cargando su pedido…', noEncontrado: 'No encontramos este pedido.', pedido: 'Pedido',
      recibido: 'Pedido recibido', recibidoS: 'El restaurante lo confirma en un momento',
      preparando: 'Preparando su comida', preparandoS: function (h) { return h ? 'Listo cerca de las ' + h : 'La cocina ya está en eso'; },
      enCamino: 'En camino', enCaminoS: 'El repartidor ya lleva su comida', enCaminoPropio: 'El repartidor del restaurante va en camino',
      listoEnvio: 'Listo', listoEnvioS: 'Esperando que el repartidor lo recoja', efectivo: '💵 Paga en efectivo al recibir',
      repartidorPropio: 'Lo lleva el repartidor del restaurante', listo: 'Listo para retirar', listoS: function (d) { return d ? 'En ' + d : 'Ya puede pasar'; },
      entregado: 'Entregado', entregadoS: '¡Buen provecho!', retirado: 'Retirado', retiradoS: '¡Buen provecho!',
      cancelado: 'Pedido cancelado', canceladoS: function (m) { return m || 'El restaurante no pudo tomar este pedido.'; },
      pagado: '✓ Pagado con tarjeta', porPagar: 'Confirmando su pago…', fallido: 'El pago no se completó: este pedido no se hizo.',
      enLocal: '🏪 Paga al retirar', reembolsado: '↩︎ Devuelto a su tarjeta', seguir: 'Seguir al repartidor en DoorDash',
      resumen: 'Su pedido', subtotal: 'Subtotal', impuesto: 'Impuesto', envio: 'Envío', propina: 'Propina', total: 'Total',
      repartidor: 'Lo recoge un repartidor de DoorDash', retiroEn: 'Retiro en', llamar: 'Llamar al restaurante', actualizado: 'Se actualiza solo',
      mapaEspera: 'Esperando la ubicación del repartidor…', mapaCerca: 'Su repartidor ya está por llegar',
      mapaDist: function (mi) { return 'Su repartidor está a unas ' + mi + ' millas'; }, mapaHace: function (s) { return 'Actualizado hace ' + (s < 60 ? s + ' s' : Math.round(s / 60) + ' min'); },
    };
    document.documentElement.lang = EN ? 'en' : 'es';
    document.getElementById('cargando').textContent = T.cargando;
    document.title = EN ? 'Your order' : 'Su pedido';

    var local = null, pedido = null, avisado = false, cuenta = 0, timer = null;
    function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
    function dinero(v) { return '$' + (Math.round(Number(v || 0) * 100) / 100).toFixed(2); }
    function hora(d) {
      try { return new Date(d).toLocaleTimeString(EN ? 'en-US' : 'es-US', { timeZone: (local && local.zona_horaria) || 'America/New_York', hour: 'numeric', minute: '2-digit' }); }
      catch (e) { return ''; }
    }
    function rpc(fn, cuerpo) {
      return fetch(SB + '/rpc/' + fn, { method: 'POST', headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(cuerpo), cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
    }
    function avisar() {
      if (avisado) return; avisado = true;
      try { fetch(AVISO, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t: token, evento: 'volvio_de_pagar' }), keepalive: true }); } catch (e) {}
    }

    function pintar() {
      var p = pedido, app = document.getElementById('app');
      if (!p) { app.innerHTML = '<p class="cargando">' + esc(T.noEncontrado) + '</p>'; return; }
      var envio = p.tipo_entrega === 'domicilio';
      var est = p.estado_pedido;
      var cancelado = est === 'cancelado' || p.pago_estado === 'fallido';
      var propio = /propio/.test(p.envio_proveedor || '');
      var paso = est === 'entregado' ? 3 : (est === 'en_camino' || est === 'llegado' || (!envio && est === 'listo')) ? 2 : (est === 'preparando' || est === 'listo' || p.restaurante_aceptado) ? 1 : 0;
      var listoEnvio = envio && paso === 1 && (est === 'listo' || p.fecha_listo);
      var chofer = p.nombre_moto ? ' · ' + p.nombre_moto : '';
      var pasos = envio
        ? [[T.recibido, T.recibidoS], listoEnvio ? [T.listoEnvio, T.listoEnvioS] : [T.preparando, T.preparandoS(p.timer_lanzamiento ? hora(p.timer_lanzamiento) : '')], [T.enCamino, (propio ? T.enCaminoPropio : T.enCaminoS) + chofer], [T.entregado, T.entregadoS]]
        : [[T.recibido, T.recibidoS], [T.preparando, T.preparandoS(p.timer_lanzamiento ? hora(p.timer_lanzamiento) : '')], [T.listo, T.listoS(p.direccion_retiro || '')], [T.retirado, T.retiradoS]];
      var h = '<div class="local">' + esc(p.restaurante || '') + ' · ' + esc(T.pedido) + ' #' + esc(p.id) + '</div>';
      if (cancelado) {
        h += '<h1>' + esc(T.cancelado) + '</h1><p class="sub">' + esc(p.pago_estado === 'fallido' ? T.fallido : T.canceladoS(p.restaurante_motivo_rechazo)) + '</p>';
      } else {
        h += '<h1>' + esc(pasos[paso][0]) + '</h1><p class="sub">' + esc(pasos[paso][1]) + '</p>';
      }
      // pago
      var pg = p.pago_estado;
      if (pg === 'pagado') h += '<div class="pago ok">' + esc(T.pagado) + '</div>';
      else if (pg === 'por_pagar') h += '<div class="pago espera">' + esc(T.porPagar) + '</div>';
      else if (pg === 'en_local') h += '<div class="pago espera">' + esc(envio ? T.efectivo : T.enLocal) + '</div>';
      else if (pg === 'reembolsado') h += '<div class="pago ok">' + esc(T.reembolsado) + '</div>';
      else if (pg === 'fallido' && !cancelado) h += '<div class="pago err">' + esc(T.fallido) + '</div>';
      if (envio && propio && !cancelado && (est === 'en_camino' || est === 'llegado')) h += '<div id="mapa-lugar"></div>';
      if (envio && p.envio_seguimiento_url && !cancelado && est !== 'entregado') {
        h += '<a class="boton" target="_blank" rel="noopener" href="' + esc(p.envio_seguimiento_url) + '">🛵 ' + esc(T.seguir) + '</a>';
      }
      // pasos
      if (!cancelado) {
        h += '<div class="caja"><ul class="pasos">' + pasos.map(function (s, i) {
          var cl = i < paso || (i === paso && paso === 3) ? 'hecho' : (i === paso ? 'ahora' : '');
          return '<li class="' + cl + '"><span class="pt">' + (cl === 'hecho' ? '✓' : '') + '</span><span>' + esc(s[0]) + (i === paso ? '<small>' + esc(s[1]) + '</small>' : '') + '</span></li>';
        }).join('') + '</ul></div>';
      }
      // resumen
      var items = Array.isArray(p.items_json) ? p.items_json : [];
      h += '<div class="caja"><div class="titulo">' + esc(T.resumen) + '</div>' +
        items.map(function (l) { return '<div class="fila"><span>' + esc(l.cant) + '× ' + esc(l.nombre) + '</span><span>' + dinero(l.total) + '</span></div>'; }).join('') +
        '<div class="fila gris" style="margin-top:6px"><span>' + esc(T.subtotal) + '</span><span>' + dinero(p.precio_base_productos) + '</span></div>' +
        (Number(p.impuesto) ? '<div class="fila gris"><span>' + esc(T.impuesto) + '</span><span>' + dinero(p.impuesto) + '</span></div>' : '') +
        (envio ? '<div class="fila gris"><span>' + esc(T.envio) + '</span><span>' + dinero(p.precio_calculado) + '</span></div>' : '') +
        (Number(p.propina) ? '<div class="fila gris"><span>' + esc(T.propina) + '</span><span>' + dinero(p.propina) + '</span></div>' : '') +
        '<div class="fila total"><span>' + esc(T.total) + '</span><span>' + dinero(p.monto_total) + '</span></div>' +
        '<p class="gris" style="font-size:13px;margin-top:10px">' + esc(envio ? (propio ? T.repartidorPropio : T.repartidor) : (T.retiroEn + ' ' + (p.direccion_retiro || ''))) + '</p>' +
        (local && local.telefono ? '<a class="boton" style="background:#fff;color:var(--tinta);border:1px solid var(--linea)" href="tel:' + esc(local.telefono) + '">📞 ' + esc(T.llamar) + '</a>' : '') +
        '</div>';
      h += '<p class="pie">' + esc(T.actualizado) + ' · DEWAN</p>';
      app.innerHTML = h;
      ponerMapa();
    }

    // ---------- mapa del repartidor (caja que no se borra al repintar) ----------
    var mapaCaja = null, mapa = null, pinMoto = null, pinCasa = null, ultimoMapa = null, leaflet = null;
    function cargarLeaflet() {
      if (leaflet) return leaflet;
      leaflet = new Promise(function (ok, mal) {
        var c = document.createElement('link'); c.rel = 'stylesheet'; c.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css'; document.head.appendChild(c);
        var j = document.createElement('script'); j.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js'; j.onload = function () { ok(window.L); }; j.onerror = mal; document.head.appendChild(j);
      });
      return leaflet;
    }
    function millas(a, b, c, d) {
      var r = Math.PI / 180, x = Math.sin((c - a) * r / 2), y = Math.sin((d - b) * r / 2);
      return 3958.8 * 2 * Math.asin(Math.sqrt(x * x + Math.cos(a * r) * Math.cos(c * r) * y * y));
    }
    function ponerMapa() {
      var lugar = document.getElementById('mapa-lugar');
      if (!lugar) return;
      if (!mapaCaja) {
        mapaCaja = document.createElement('div'); mapaCaja.className = 'caja';
        mapaCaja.innerHTML = '<div class="mapa" id="mapa" style="display:none"></div><div class="mapa-txt" id="mapa-txt">' + esc(T.mapaEspera) + '</div>';
      }
      lugar.appendChild(mapaCaja);
      if (mapa) mapa.invalidateSize();
      dibujarMapa();
    }
    function dibujarMapa() {
      var m = ultimoMapa, txt = document.getElementById('mapa-txt');
      if (!m || !txt) return;
      var hace = m.at ? Math.max(0, Math.round((Date.parse(m.ahora) - Date.parse(m.at)) / 1000)) : null;
      var fresca = m.lat != null && hace !== null && hace < 180;
      if (!fresca) { txt.innerHTML = esc(T.mapaEspera); return; }
      var casa = m.entrega_lat != null && m.entrega_lng != null;
      var mi = casa ? millas(Number(m.lat), Number(m.lng), Number(m.entrega_lat), Number(m.entrega_lng)) : null;
      txt.innerHTML = (mi !== null ? esc(mi < 0.15 ? T.mapaCerca : T.mapaDist(mi.toFixed(1))) : '') + '<small>' + esc(T.mapaHace(hace)) + '</small>';
      cargarLeaflet().then(function (Lf) {
        var div = document.getElementById('mapa');
        if (!div) return;
        div.style.display = 'block';
        if (!mapa) {
          mapa = Lf.map(div, { zoomControl: false, attributionControl: true, scrollWheelZoom: false });
          mapa.attributionControl.setPrefix('<a href="https://leafletjs.com">Leaflet</a>');
          Lf.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(mapa);
          pinMoto = Lf.marker([m.lat, m.lng], { icon: Lf.divIcon({ className: '', html: '<div class="pin-moto"></div>', iconSize: [22, 22], iconAnchor: [11, 11] }) }).addTo(mapa);
          if (casa) pinCasa = Lf.marker([m.entrega_lat, m.entrega_lng], { icon: Lf.divIcon({ className: '', html: '<div class="pin-casa"></div>', iconSize: [16, 16], iconAnchor: [8, 8] }) }).addTo(mapa);
        } else {
          pinMoto.setLatLng([m.lat, m.lng]);
        }
        if (casa) mapa.fitBounds([[m.lat, m.lng], [m.entrega_lat, m.entrega_lng]], { padding: [36, 36], maxZoom: 16 });
        else mapa.setView([m.lat, m.lng], 15);
        mapa.invalidateSize();
      }).catch(function () {});
    }
    function pedirMapa() {
      return fetch(SB + '/rpc/us_seguimiento_mapa', { method: 'POST', headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_token: token }), cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; }).then(function (m) { ultimoMapa = m; }).catch(function () {});
    }

    function cargar() {
      // prueba local sin base: us.html?json=<archivo>.json (solo localhost)
      if (q.get('json') && /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
        fetch(q.get('json'), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) { pedido = d.pedido; local = d.local; pintar(); });
        return;
      }
      if (!token) { pedido = null; pintar(); return; }
      // us_seguimiento → { pedido: {estado, platos, montos, pago, envío…}, local: {nombre, telefono, zona_horaria} } o null
      rpc('us_seguimiento', { p_token: token }).then(function (d) {
        pedido = d && d.pedido ? d.pedido : null;
        if (d && d.local) local = d.local;
        else if (pedido && !local) local = {};
      }).then(function () {
        var conMapa = pedido && /propio/.test(pedido.envio_proveedor || '') && (pedido.estado_pedido === 'en_camino' || pedido.estado_pedido === 'llegado');
        return conMapa ? pedirMapa() : null;
      }).then(function () {
        if (pedido && volvioDePagar && pedido.pago_estado === 'por_pagar') avisar();
        pintar();
        var fin = !pedido || pedido.estado_pedido === 'entregado' || pedido.estado_pedido === 'cancelado' || pedido.pago_estado === 'fallido';
        var enCaminoPropio = pedido && /propio/.test(pedido.envio_proveedor || '') && (pedido.estado_pedido === 'en_camino' || pedido.estado_pedido === 'llegado');
        cuenta++;
        if (!fin) timer = setTimeout(cargar, enCaminoPropio ? 10000 : (cuenta < 12 ? 5000 : 15000));
      });
    }
    cargar();
  })();
  </script>
</body>
</html>
