  function fechaLarga(v) {
    if (!v) return '';
    var s = String(v), d;
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) { var x = s.split('-'); d = { y: +x[0], m: +x[1] - 1, d: +x[2] }; }
    else { var f = new Date(s); var p = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', year: 'numeric', month: 'numeric', day: 'numeric' }).formatToParts(f);
      var g = function (t) { return +p.filter(function (o) { return o.type === t; })[0].value; }; d = { y: g('year'), m: g('month') - 1, d: g('day') }; }
    return T[L].fecha2(d.d, T[L].meses[d.m], d.y);
  }
  function dinero(n) { n = Number(n) || 0; return '$' + (n % 1 ? n.toFixed(2) : String(n)); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

    txt('m-fecha', t.fecha + ': ' + fechaLarga(p.creada_at));
    txt('m-valida', t.valida + ': ' + fechaLarga(p.valida_hasta));
    txt('m-codigo', t.codigo + ' ' + p.codigo.toUpperCase());

    txt('h-logra', t.hLogra); lista('l-logra', t.logra);

    txt('h-envio', t.hEnvio); lista('l-envio', t.envio);

    $('l-dias').innerHTML = t.dias.map(function (d) { return '<div class="dia"><b>' + esc(d[0]) + '</b><span>' + esc(d[1]) + '</span></div>'; }).join('');
    txt('h-necesita', t.hNecesita); $('l-necesita').innerHTML = t.necesita.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('');

    $('s-inversion').classList.toggle('oculto', !formal);

      txt('f-dewan-d', t.firmaDewan);
    }
    var otro = L === 'es' ? 'en' : 'es';
    $('b-idioma').href = '?p=' + encodeURIComponent(codigo) + '&lang=' + otro;
    $('cargando').classList.add('oculto'); $('falla').classList.add('oculto'); $('doc').classList.remove('oculto');
  }

  function rpc(fn, body) {
    return fetch(SB + '/rest/v1/rpc/' + fn, { method: 'POST', headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) })

  ['i-nombre', 'i-email', 'i-chk'].forEach(function (id) { $(id).addEventListener('input', revisar); $(id).addEventListener('change', revisar); });
  function revisar() { $('b-acepto').disabled = !($('i-chk').checked && $('i-nombre').value.trim().length >= 3 && /.+@.+\..+/.test($('i-email').value.trim())); }
  $('f-acepto').addEventListener('submit', function (e) {
    e.preventDefault();
    var t = T[L], nombre = $('i-nombre').value.trim(), email = $('i-email').value.trim();
    if (nombre.length < 3 || !/.+@.+\..+/.test(email) || !$('i-chk').checked) { txt('ac-err', t.acFalta); return; }
    $('b-acepto').disabled = true; txt('ac-err', '');
    rpc('us_propuesta_aceptar', { p_codigo: codigo, p_nombre: nombre, p_cargo: $('i-cargo').value.trim(), p_email: email })
      .then(function (r) {
        if (r && r.ok) { P.aceptada_at = r.aceptada_at; P.aceptada_nombre = r.aceptada_nombre || nombre; P.aceptada_cargo = r.aceptada_cargo || $('i-cargo').value.trim(); pintar(); window.scrollTo(0, $('s-listo').offsetTop - 20); }
        else { txt('ac-err', r && r.error === 'vencida' ? t.acVencida : t.acError); $('b-acepto').disabled = false; }
      })
      .catch(function () { txt('ac-err', t.acError); $('b-acepto').disabled = false; });
  });

  if (!codigo) { falla(T.es.noHay, T.es.noHayP); return; }
  rpc('us_propuesta', { p_codigo: codigo })
    .then(function (p) {
      if (!p || !p.codigo) { var l0 = q.get('lang') === 'en' ? 'en' : 'es'; falla(T[l0].noHay, T[l0].noHayP); return; }
      P = p;
      var l = q.get('lang'); L = (l === 'es' || l === 'en') ? l : (p.idioma === 'en' ? 'en' : 'es');
