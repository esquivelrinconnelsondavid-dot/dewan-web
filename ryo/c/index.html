<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ryo Burger</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#141416">
<link rel="icon" href="/ryo/icons/icon-192.png" type="image/png">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #141416; color: #f4f1ea; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
  main { padding: 32px 16px; max-width: 420px; }
  img { border-radius: 50%; }
  h1 { font-size: 26px; margin: 18px 0 8px; letter-spacing: .5px; }
  p { font-size: 16px; line-height: 1.5; color: #c9c4ba; margin: 0 0 24px; }
  a { display: inline-block; background: #25d366; color: #0b1a10; font-weight: 700; text-decoration: none;
      padding: 14px 22px; border-radius: 12px; font-size: 16px; }
</style>
</head>
<body>
<main>
  <img src="/ryo/img/logo.webp" alt="Ryo Burger" width="88" height="88">
  <h1>RYO BURGER</h1>
  <p>Esta página ya no recibe pedidos.<br>Para pedir, escríbenos por WhatsApp.</p>
  <a href="https://wa.me/593984150412">Escribir por WhatsApp</a>
</main>
<script>
  // Quita el service worker viejo y su caché (la app anterior quedaba instalada en algunos celulares)
  try { if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }); } catch (e) {}
  try { if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); }); } catch (e) {}
</script>
</body>
</html>
