# ─── Sucursal Táchira (Venezuela) ──────────────────────────────────
server {
    listen 80;
    server_name tachira.dewansas.com;
    root /usr/share/nginx/html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location ~* \.(?:js|css|png|jpg|jpeg|gif|webp|svg|ico|woff|woff2|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache" always;
    }

    # Cualquier ruta del subdominio sirve menu.html de Táchira
    location / {
        expires -1;
        add_header Cache-Control "no-cache" always;
        try_files /tachira/menu.html =404;
    }
}

# ─── Subdominio pedir (Riobamba - link de anuncios, URL limpia) ────
server {
    listen 80;
    server_name pedir.dewansas.com;
    root /usr/share/nginx/html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location ~* \.(?:js|css|png|jpg|jpeg|gif|webp|svg|ico|woff|woff2|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache" always;
    }

    # Para buscadores e IA (31-oct-2026): sin esto, /robots.txt y /sitemap.xml devolvían la app
    location = /robots.txt  { try_files /robots-pedir.txt =404; }
    location = /sitemap.xml { try_files /sitemap-pedir.xml =404; }
    location = /llms.txt    { try_files /llms.txt =404; }

    # Manifest de la app (1-nov-2026): sin esto /app/manifest-cliente.json devolvía la app ENTERA (574 KB)
    # y cada visitante bajaba la página dos veces al entrar.
    location ~* ^/app/[^/]+\.json$ {
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # [3-nov-2026] Google indexó rutas que la app usa por dentro (/motorizados?select=…, /rest/v1/…) y mandaba
    # gente a la tienda de comida. Quien busca trabajo de motorizado ve su página; lo demás va al inicio.
    # [9-nov-2026] Search Console (2–7 nov): la mitad de las veces Google mostraba rutas internas
    # (/rest/v1/rpc/…, /storage/v1/…, /restaurantes?select=…, /motorizados?select=…) en vez del inicio.
    # Todas van con 301 a la página buena. Con https:// completo: «return 301 /» salía a http:// y daba un salto de más.
    location = /motorizados {
        if ($arg_select) { return 301 https://pedir.dewansas.com/motorizados; }
        expires -1;
        add_header Cache-Control "no-cache" always;
        try_files /motorizados.html =404;
    }
    location ^~ /rest/ {
        return 301 https://pedir.dewansas.com/;
    }
    location ^~ /storage/ {
        return 301 https://pedir.dewansas.com/;
    }

    # Cualquier ruta del subdominio sirve el menu de Riobamba (URL limpia)
    location / {
        # ?select= solo lo usa la app por dentro (/restaurantes, /pedidos_delivery, /carreras…), nunca un link para gente
        if ($arg_select) { return 301 https://pedir.dewansas.com/; }
        expires -1;
        add_header Cache-Control "no-cache" always;
        try_files /app/menu.html =404;
    }
}

