<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Descarga DEWAN — delivery en Riobamba</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#FBF6EF;color:#2b1d16;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center}
  .card{padding:32px 24px;max-width:420px}
  h1{color:#DC2D22;font-size:2rem;margin:0 0 8px}
  p{margin:0 0 24px;line-height:1.5}
  a.btn{display:inline-block;background:#DC2D22;color:#fff;text-decoration:none;font-weight:700;padding:14px 28px;border-radius:12px;font-size:1.05rem}
  .mini{margin-top:16px;font-size:.85rem;color:#8a7263}
</style>
<script>
  setTimeout(function(){
    window.location.replace("https://play.google.com/store/apps/details?id=com.dewan.cliente");
  }, 400);
</script>
</head>
<body>
  <div class="card">
    <h1>🔔 DEWAN</h1>
    <p>Tus locales favoritos de Riobamba a domicilio.<br>Te estamos llevando a Google Play…</p>
    <a class="btn" href="https://play.google.com/store/apps/details?id=com.dewan.cliente">Abrir Google Play</a>
    <p class="mini">Si no avanza automáticamente, toca el botón.</p>
  </div>
</body>
</html>
